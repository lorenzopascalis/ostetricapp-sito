<style>
:root{--bg:#f2f2f7;--label:#1c1c1e;--label-2:#5c5c61;--tint:#006f85;--on-tint:#fff;--fill:rgba(120,120,128,.16);--error:#b42318;--accent:#e4703a}
@media (prefers-color-scheme:dark){:root{--bg:#000;--label:#f5f5f7;--label-2:#a1a1a8;--tint:#3cc8e0;--on-tint:#00262d;--fill:rgba(118,118,128,.28);--error:#ff8a80;--accent:#ffb07a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:var(--bg);color:var(--label);font:17px/22px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:360px;display:grid;gap:20px;justify-items:center;text-align:center}
.mark{width:64px;height:64px}
.mark circle,.mark path{fill:none;stroke:var(--tint);stroke-width:14}
.mark circle{stroke-opacity:.16}
.mark path{stroke-linecap:round}
.mark .dot{fill:var(--accent);stroke:none}
h1{margin:0;font:700 34px/41px -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.04em}
h1 b{font-weight:inherit;color:var(--tint)}
p{margin:0;color:var(--label-2);font-size:15px;line-height:20px}
h1 + p{margin-top:4px}
form{width:100%;display:grid;gap:12px;text-align:left}
input[type=password],input[type=text]{width:100%;height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--fill);color:var(--label);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;line-height:20px}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--tint)}
button{height:50px;border:0;border-radius:9999px;background:var(--tint);color:var(--on-tint);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer}
button[disabled]{opacity:.38;cursor:default}
#err{min-height:20px;color:var(--error);font-weight:500;font-size:14px;text-align:center}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="40"/><path d="M60 20A40 40 0 1 1 36.49 27.64"/><circle class="dot" cx="36.49" cy="27.64" r="11"/></svg>
  <div><h1>Ostetric<b>App</b></h1><p>Inserisci il codice di accesso che ti hanno dato.</p></div>
  <form id="f" hidden>
    <input id="codice" name="codice" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Codice di accesso" placeholder="Codice di accesso" required>
    <label class="chk"><input id="mostra" type="checkbox"> Mostra il codice</label>
    <label class="chk"><input id="ricorda" type="checkbox" checked> Ricorda su questo dispositivo</label>
    <p id="err" role="alert"></p>
    <button id="entra" type="submit">Entra</button>
  </form>
  <noscript><p>Per usare l'app serve JavaScript.</p></noscript>
</main>
